<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRM5 Mortar Calculator</title>
    <style>
        body {
            background-color: #000000;
            color: #b0b0b0;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .calculator-container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .panel {
            background-color: #121212;
            border: 1px solid #222222;
            border-radius: 8px;
            padding: 24px;
        }

        .panel-title {
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 0;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #222222;
        }

        .grid-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 11px;
            color: #707070;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            background-color: #0a0a0a;
            border: 1px solid #262626;
            color: #ffffff;
            padding: 12px;
            font-family: inherit;
            font-size: 14px;
            border-radius: 4px;
            outline: none;
            width: 100%;
            box-sizing: border-box;
        }

        input:focus {
            border-color: #444444;
        }

        /* Remove default spin buttons for number inputs */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        button {
            background-color: #1c1c1c;
            border: 1px solid #333333;
            color: #ffffff;
            padding: 14px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.2s, border-color 0.2s;
        }

        button:hover {
            background-color: #262626;
            border-color: #444444;
        }

        .divider {
            border: none;
            border-top: 1px solid #222222;
            margin: 12px 0;
            width: 100%;
        }

        .output-row {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 24px;
            font-size: 15px;
            color: #ffffff;
            text-align: center;
            padding: 10px 0;
        }

        .output-highlight {
            color: #ffffff;
            font-weight: bold;
        }
        
        .output-error {
            color: #ff4a4a;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

<div class="calculator-container">
    
    <!-- Input Panel matching the layout style -->
    <div class="panel">
        <div class="panel-title">Trajectory Inputs</div>
        <div class="grid-inputs">
            <div class="input-group">
                <label for="theta">Elevation Angle (°)</label>
                <input type="number" id="theta" value="45" oninput="calculateTrajectory()">
            </div>
            <div class="input-group">
                <label for="distance">Target Distance / Range (m)</label>
                <input type="number" id="distance" placeholder="Enter meters" oninput="calculateTrajectory()">
            </div>
        </div>
    </div>

    <button onclick="calculateTrajectory()">Calculate</button>

    <hr class="divider">

    <!-- Bottom summary output row displaying all data strings from the new script -->
    <div class="output-row" id="outputPanel">
        <span>Direct: <span class="output-highlight">--</span></span>
        <span>|</span>
        <span>Indirect: <span class="output-highlight">--</span></span>
    </div>
    
    <!-- Side Note Block -->
    <div style="margin-top: 40px; border-top: 1px solid #1a1a1a; padding-top: 15px; font-size: 11px; color: #555555; text-align: center; letter-spacing: 0.5px; line-height: 1.6;">
       Aim a little bit to the right(abt 1 to 2 degree) for farther target <br>
       Credits to u/alex52794
    </div>

</div>

<script>
    function calculateTrajectory() {
        const thetaDeg = parseFloat(document.getElementById('theta').value);
        const rangefinder_range = parseFloat(document.getElementById('distance').value);
        const outputPanel = document.getElementById('outputPanel');

        // Reset display if empty
        if (isNaN(thetaDeg) || isNaN(rangefinder_range)) {
            outputPanel.innerHTML = `
                <span>Direct: <span class="output-highlight">--</span></span>
                <span>|</span>
                <span>Indirect: <span class="output-highlight">--</span></span>
            `;
            return;
        }

        // New Script Global Constants
        const G = 9.81;
        const u = 80;

        // Mode 4 calculation logic mapping to component vectors
        const thetaRad = thetaDeg * (Math.PI / 180);
        const dx = rangefinder_range * Math.cos(thetaRad);
        const dy = 0;
        const s = rangefinder_range * Math.sin(thetaRad);

        // Calculate ground distance
        const d = Math.sqrt(Math.pow(dx, 2) + Math.pow(dy, 2));

        // Determinant check from new script
        const determinant = Math.pow(u, 4) - G * (G * Math.pow(d, 2) + 2 * s * Math.pow(u, 2));

        if (determinant < 0) {
            outputPanel.innerHTML = `<span class="output-error">Target not reachable</span>`;
            return;
        }

        let k1 = 0;
        let k2 = 0;
        if (dx !== 0 || dy !== 0) {
            k1 = (Math.pow(u, 2) - Math.sqrt(determinant)) / (G * d);
            k2 = (Math.pow(u, 2) + Math.sqrt(determinant)) / (G * d);
        }

        const direct_angle = Math.atan(k1) * (180 / Math.PI);
        const indirect_angle = Math.atan(k2) * (180 / Math.PI);

        // Time helper calculation
        const t_direct = d / (u * Math.cos(direct_angle * (Math.PI / 180)));
        const t_indirect = d / (u * Math.cos(indirect_angle * (Math.PI / 180)));

        // Direction/bearing calculations adjusted for time metrics
        let bearing = Math.atan2(dx, dy) * (180 / Math.PI);
        if (bearing < 0) bearing += 360;

        const dir_direct = Math.round(bearing - (1 * t_direct) / 12);
        const dir_indirect = Math.round(bearing - (1 * t_indirect) / 12);

        // Render clean, detailed breakdown matching your new Python output requirements
        outputPanel.innerHTML = `
            <div style="display: flex; flex-direction: column; gap: 8px; width: 100%; text-align: left; max-width: 600px; margin: 0 auto; font-size: 14px;">
                <div>Distance from target: <span class="output-highlight">${d.toFixed(2)}m</span></div>
                <div style="border-top: 1px dashed #222; margin: 4px 0;"></div>
                <div><strong>Direct Fire Angle:</strong> <span class="output-highlight">${direct_angle.toFixed(1)}°</span></div>
                <div>Direction: <span class="output-highlight">${dir_direct}°</span></div>
                <div>Time of Travel: <span class="output-highlight">${t_direct.toFixed(1)}s</span></div>
                <div style="border-top: 1px dashed #222; margin: 4px 0;"></div>
                <div><strong>Indirect Fire Angle:</strong> <span class="output-highlight">${indirect_angle.toFixed(1)}°</span></div>
                <div>Direction: <span class="output-highlight">${dir_indirect}°</span></div>
                <div>Time of Travel: <span class="output-highlight">${t_indirect.toFixed(1)}s</span></div>
            </div>
        `;
    }
</script>

</body>
</html>
