<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRM5 Mortar Calculator</title>
    <style>
        body {
            background-color: #000000;
            color: #b0b0b0;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .calculator-container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .panel {
            background-color: #121212;
            border: 1px solid #222222;
            border-radius: 8px;
            padding: 24px;
        }

        .panel-title {
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 0;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #222222;
        }

        .grid-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 11px;
            color: #707070;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            background-color: #0a0a0a;
            border: 1px solid #262626;
            color: #ffffff;
            padding: 12px;
            font-family: inherit;
            font-size: 14px;
            border-radius: 4px;
            outline: none;
            width: 100%;
            box-sizing: border-box;
        }

        input:focus {
            border-color: #444444;
        }

        /* Remove default spin buttons for number inputs */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        button {
            background-color: #1c1c1c;
            border: 1px solid #333333;
            color: #ffffff;
            padding: 14px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.2s, border-color 0.2s;
        }

        button:hover {
            background-color: #262626;
            border-color: #444444;
        }

        .divider {
            border: none;
            border-top: 1px solid #222222;
            margin: 12px 0;
            width: 100%;
        }

        .output-row {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 24px;
            font-size: 16px;
            color: #ffffff;
            text-align: center;
            padding: 10px 0;
        }

        .output-highlight {
            color: #ffffff;
            font-weight: bold;
        }
        
        .output-error {
            color: #ff4a4a;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

<div class="calculator-container">
    
    <!-- Input Panel matching the screenshot layout style -->
    <div class="panel">
        <div class="panel-title">Trajectory Inputs</div>
        <div class="grid-inputs">
            <div class="input-group">
                <label for="theta">Elevation Angle (°)</label>
                <input type="number" id="theta" value="45" oninput="calculateTrajectory()">
            </div>
            <div class="input-group">
                <label for="distance">Target Distance (m)</label>
                <input type="number" id="distance" placeholder="Enter meters" oninput="calculateTrajectory()">
            </div>
        </div>
    </div>

    <button onclick="calculateTrajectory()">Calculate</button>

    <hr class="divider">

    <!-- Bottom summary output row matching the screenshot layout style -->
    <div class="output-row" id="outputPanel">
        <span>Low Angle: <span class="output-highlight">--</span></span>
        <span>|</span>
        <span>High Angle: <span class="output-highlight">--</span></span>
    </div>
    <!-- Side Note Block -->
    <div style="margin-top: 40px; border-top: 1px solid #1a1a1a; padding-top: 15px; font-size: 11px; color: #555555; text-align: center; letter-spacing: 0.5px; line-height: 1.6;">
       Aim a little bit to the right(abt 1 to 2 degree) for farther target <br>
       Credits to u/alex52794
    </div>

</div>

<script>
    function calculateTrajectory() {
        const thetaDeg = parseFloat(document.getElementById('theta').value);
        const d = parseFloat(document.getElementById('distance').value);
        const outputPanel = document.getElementById('outputPanel');

        // Reset display if empty
        if (isNaN(thetaDeg) || isNaN(d)) {
            outputPanel.innerHTML = `
                <span>Low Angle: <span class="output-highlight">--</span></span>
                <span>|</span>
                <span>High Angle: <span class="output-highlight">--</span></span>
            `;
            return;
        }

        const theta = thetaDeg * (Math.PI / 180);
        const vi = 76;
        const g = 9.8;

        const x = d * Math.cos(theta);
        const y = d * Math.sin(theta);

        const determinant = Math.pow(vi, 4) - g * (g * Math.pow(x, 2) + 2 * Math.pow(vi, 2) * (y - 1.14));

        if (determinant < 0) {
            outputPanel.innerHTML = `<span class="output-error">Target is out of range</span>`;
            return;
        }

        const r_high = Math.atan((Math.pow(vi, 2) + Math.sqrt(determinant)) / (g * x));
        const r_low = Math.atan((Math.pow(vi, 2) - Math.sqrt(determinant)) / (g * x));

        const t_high = x / (vi * Math.cos(r_high));
        const t_low = x / (vi * Math.cos(r_low));

        const lowAngleDeg = r_low * (180 / Math.PI);
        const highAngleDeg = r_high * (180 / Math.PI);

        // Render matching the bottom row text style from the image
        outputPanel.innerHTML = `
            <span>Low Angle: <span class="output-highlight">${lowAngleDeg.toFixed(2)}° (${t_low.toFixed(1)}s)</span></span>
            <span>|</span>
            <span>High Angle: <span class="output-highlight">${highAngleDeg.toFixed(2)}° (${t_high.toFixed(1)}s)</span></span>
        `;
    }
</script>

</body>
</html>
