<!DOCTYPE html>
<html>
<head>
    <title>BRM5 Mortar Calculator</title>
</head>
<body>

    <h2>BRM5 Mortar Calculator</h2>
    
    <p>
        Elevation Angle (Degrees): <br>
        <input type="number" id="theta" value="45">
    </p>

    <p>
        Target Distance (Meters): <br>
        <input type="number" id="distance">
    </p>

    <button onclick="calculateTrajectory()">Calculate</button>

    <div id="outputPanel" style="margin-top: 20px;"></div>

<script>
    function calculateTrajectory() {
        const thetaDeg = parseFloat(document.getElementById('theta').value);
        const d = parseFloat(document.getElementById('distance').value);
        const outputPanel = document.getElementById('outputPanel');

        if (isNaN(thetaDeg) || isNaN(d)) {
            outputPanel.innerHTML = "Please enter valid numbers.";
            return;
        }

        const theta = thetaDeg * (Math.PI / 180);
        const vi = 76;
        const g = 9.8;

        const x = d * Math.cos(theta);
        const y = d * Math.sin(theta);

        const determinant = Math.pow(vi, 4) - g * (g * Math.pow(x, 2) + 2 * Math.pow(vi, 2) * (y - 1.14));

        if (determinant < 0) {
            outputPanel.innerHTML = "Target is out of range.";
            return;
        }

        const r_high = Math.atan((Math.pow(vi, 2) + Math.sqrt(determinant)) / (g * x));
        const r_low = Math.atan((Math.pow(vi, 2) - Math.sqrt(determinant)) / (g * x));

        const t_high = x / (vi * Math.cos(r_high));
        const t_low = x / (vi * Math.cos(r_low));

        const lowAngleDeg = r_low * (180 / Math.PI);
        const highAngleDeg = r_high * (180 / Math.PI);

        outputPanel.innerHTML = 
            "Low angle: " + lowAngleDeg.toFixed(2) + " degrees, Time: " + t_low.toFixed(2) + " seconds<br>" +
            "High angle: " + highAngleDeg.toFixed(2) + " degrees, Time: " + t_high.toFixed(2) + " seconds";
    }
</script>

</body>
</html>
